# Android .apk без ПК: GitHub збирає застосунок і кладе його в реліз «apk-latest».
# Завантажити (і з телефону): https://github.com/MikeLiashenko/WarAllarm/releases/download/apk-latest/WarAlarm.apk
#
# Підпис: один постійний ключ WarAlarm і тут, і на ПК, тож кожен новий APK ставиться ПОВЕРХ попереднього.
# Ключ лежить у секретах репозиторію (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# На ПК той самий ключ: %USERPROFILE%\.android\waralarm-release.jks + app/android/key.properties (не в git).
# Без секретів збірка зупиняється, щоб не випустити APK з чужим підписом.
name: Build Android (.apk)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Немає ключа підпису в секретах ANDROID_KEYSTORE_* — APK з іншим підписом не ставиться поверх"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/waralarm.keystore"
          {
            echo "WARALARM_KEYSTORE=$RUNNER_TEMP/waralarm.keystore"
            echo "WARALARM_KEYSTORE_PASSWORD=$KS_PASS"
            echo "WARALARM_KEY_ALIAS=$KEY_ALIAS"
            echo "WARALARM_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          echo "🔑 Підпис постійним ключем WarAlarm"

      - run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk WarAlarm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WarAlarm-apk
          path: app/WarAlarm.apk
          retention-days: 14

      - name: Publish release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        # Не «видалити й створити»: 25.11 GitHub двічі віддав 500/503 на видалення релізу, і новий APK
        # не вийшов. Тепер — новий файл поверх старого (посилання те саме), тег переносимо на цей коміт.
        run: |
          TITLE="Android APK ($GITHUB_REF_NAME @ ${GITHUB_SHA::7})"
          NOTES="Завантажити: https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/WarAlarm.apk  ·  Підпис: постійний ключ WarAlarm (ставиться поверх попередньої версії)"
          git tag -f apk-latest "$GITHUB_SHA" && git push -f origin refs/tags/apk-latest
          for i in 1 2 3 4; do
            if gh release view apk-latest >/dev/null 2>&1; then
              gh release upload apk-latest WarAlarm.apk --clobber && gh release edit apk-latest --title "$TITLE" --notes "$NOTES" --prerelease && exit 0
            else
              gh release create apk-latest WarAlarm.apk --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes "$NOTES" && exit 0
            fi
            sleep $((10 * i))
          done
          exit 1
