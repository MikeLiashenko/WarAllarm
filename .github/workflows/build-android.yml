# Android .apk без ПК: GitHub збирає застосунок і кладе його в реліз «apk-latest».
# Завантажити (і з телефону): https://github.com/MikeLiashenko/WarAllarm/releases/download/apk-latest/WarAlarm.apk
#
# Підпис. Щоб APK ставився ПОВЕРХ уже встановленого (зібраного на ПК), він має бути підписаний
# тим самим ключем. Додай у Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_BASE64  — base64 файлу ключа. Для ключа з ПК (Windows, PowerShell):
#       [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:USERPROFILE\.android\debug.keystore")) | Set-Clipboard
#   (необов'язково, якщо ключ не debug) ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Без секретів APK підписується випадковим debug-ключем GitHub: ставиться лише після видалення старого.
name: Build Android (.apk)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Signing key (from secrets, if set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/waralarm.keystore"
            echo "WARALARM_KEYSTORE=$RUNNER_TEMP/waralarm.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
            echo "🔑 Підпис ключем із секретів"
          else
            echo "SIGNED=no" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 не задано — APK підписано debug-ключем GitHub (ставиться лише після видалення старого застосунку)"
          fi

      - run: flutter pub get

      - name: Build APK
        env:
          WARALARM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WARALARM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WARALARM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Порожній секрет = не задано → у Gradle беруться значення debug-ключа.
          [ -n "$WARALARM_KEYSTORE_PASSWORD" ] || unset WARALARM_KEYSTORE_PASSWORD
          [ -n "$WARALARM_KEY_ALIAS" ] || unset WARALARM_KEY_ALIAS
          [ -n "$WARALARM_KEY_PASSWORD" ] || unset WARALARM_KEY_PASSWORD
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk WarAlarm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WarAlarm-apk
          path: app/WarAlarm.apk
          retention-days: 14

      - name: Publish release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNED" = yes ]; then SIG="підписано ключем із секретів — ставиться поверх"; else SIG="debug-ключ GitHub — спершу видали старий застосунок"; fi
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest WarAlarm.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Android APK ($GITHUB_REF_NAME @ ${GITHUB_SHA::7})" \
            --notes "Завантажити: https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/WarAlarm.apk  ·  Підпис: $SIG"
