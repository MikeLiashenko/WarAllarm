# Перевірка пошуку укриттів (OpenStreetMap / Overpass): чи відповідають дзеркала і що знаходить
# запит застосунку й бота біля точки. Запуск вручну: Actions → Shelters check → Run workflow.
name: Shelters check

on:
  workflow_dispatch:
    inputs:
      lat: { description: 'Широта', default: '50.4501' }
      lon: { description: 'Довгота', default: '30.5234' }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query Overpass mirrors
        env:
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
        run: |
          UA="WarAlarm/1.0 (shelter search)"
          q() { A="(around:$1,$LAT,$LON)"; echo "[out:json][timeout:12];(nw$A[\"amenity\"=\"shelter\"][\"shelter_type\"!~\"^(public_transport|picnic_shelter|weather_shelter|lean_to|basic_hut|field_shelter|rock_shelter|sun_shelter|gazebo|changing_rooms)$\"][\"public_transport\"!~\".\"][\"bus\"!=\"yes\"];nw$A[\"building\"=\"bunker\"];node$A[\"railway\"=\"subway_entrance\"];nw$A[\"amenity\"=\"parking\"][\"parking\"=\"underground\"];);out center tags 60;"; }
          for h in overpass-api.de overpass.private.coffee overpass.kumi.systems; do
            for r in 1500 3000; do
              for try in 1 2; do
                code=$(curl -s -o "r_${h}_$r.json" -w "%{http_code} %{time_total}s" -m 20 -A "$UA" --data-urlencode "data=$(q $r)" "https://$h/api/interpreter" || echo "fail")
                echo "== $h · ${r} м · спроба $try → $code"
                case "$code" in 200*) break;; esac
                sleep 4
              done
            done
          done
          python3 - <<'EOF'
          import json, collections, glob
          for f in sorted(glob.glob("r_*.json")):
              try: els = json.load(open(f))["elements"]
              except Exception as e: print(f, "—", open(f).read()[:120].replace("\n", " ")); continue
              c = collections.Counter()
              for e in els:
                  t = e.get("tags", {})
                  c["shelter:" + t.get("shelter_type", "-") if t.get("amenity") == "shelter" else
                    "bunker" if t.get("building") == "bunker" else
                    "parking" if t.get("amenity") == "parking" else "metro_entrance"] += 1
              print(f, len(els), dict(c.most_common()))
              for e in els[:8]: print("   ", {k: v for k, v in e.get("tags", {}).items() if k in ("name", "amenity", "shelter_type", "building", "railway", "ref", "addr:street", "addr:housenumber")})
          EOF
