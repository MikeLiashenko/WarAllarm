    c.font = '600 '+fs+'px "Segoe UI",system-ui,sans-serif';
    c.lineWidth = 3; c.strokeStyle = PAL.land; c.strokeText(nm, q[0]+5, q[1]-4);
    c.fillStyle = color; c.fillText(nm, q[0]+5, q[1]-4);
  };
  const dot = (q, r, color) => { c.beginPath(); c.arc(q[0], q[1], r, 0, 7); c.fillStyle = color; c.fill(); c.lineWidth = 1; c.strokeStyle = PAL.land; c.stroke(); };
  if(z < 1.7){
    for(const [nm, lon, lat] of CITIES){
      const q = P(lon, lat); dot(q, 2.4, PAL.primary);
      if(!fit.narrow || BIG.has(nm)) label(nm, q, fit.narrow ? 10.5 : 12.5, PAL.tx);
    }
  } else {
    const seen = new Set();
    for(const [nm0, lon, lat, tier] of PLACES){
      const nm = LABEL[nm0] || nm0;
      if(/[A-Za-z]/.test(nm)) continue; // «Desna», «Darnytsya Car Repair Plant Microdistrict» — англ. дублі
      const show = (tier <= 1 && (!isDistrict(nm) || tier === 0) && (tier === 0 || !seen.has(nm))) || (tier === 2 && z >= 2.8) || (tier === 3 && z >= 4.2);
      if(!show) continue;
      const q = P(lon, lat);
      if(q[0] < -30 || q[0] > W+30 || q[1] < -20 || q[1] > H+20) continue;
      if(tier === 3){ const k = ((q[0]/46)|0)*100000 + ((q[1]/46)|0), n = cell.get(k)||0; if(n >= 2) continue; cell.set(k, n+1); }
      seen.add(nm);
      dot(q, tier === 0 ? 2.6 : tier === 1 ? 2.1 : tier === 2 ? 1.6 : 1.1, tier === 3 ? '#5F6A7A' : PAL.primary);
      if(tier === 3 && z < 5.2) continue;
      label(nm, q, tier === 0 ? 12.5 : tier === 1 ? 11 : tier === 2 ? 10 : 9, tier === 3 ? PAL.mut : PAL.tx);
    }
  }
}

function text(s, x, y, size, color, align='left', bold=true){
  ctx.font = `${bold?700:600} ${size}px "Segoe UI",system-ui,sans-serif`; ctx.textAlign = align;
  ctx.lineWidth = 3.5; ctx.strokeStyle = PAL.land; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.textAlign = 'left';
}
function dashed(draw, color, width){ ctx.save(); ctx.setLineDash([5,4]); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.beginPath(); draw(); ctx.stroke(); ctx.restore(); }

// Ціль — як _drawIcon застосунку: світіння, темний контур, корпус «світлий ніс → колір → темніше».
function drawIcon(x, y, heading, cat, color, ppu, glow, strength){
  const parts = FIGS[cat] || FIGS.other, k = (FIG_SCALE[cat]||.8)*ppu;
  ctx.save(); ctx.translate(x, y); ctx.rotate(heading*RAD); ctx.scale(k, k);
  const body = parts.filter(p => !p.s);
  ctx.save(); ctx.shadowColor = hexA(glow||color, .75*strength); ctx.shadowBlur = 9*dpr;
  ctx.fillStyle = hexA(glow||color, .75*strength); for(const p of body) ctx.fill(pp(p.d)); ctx.restore();
  ctx.lineWidth = 2.2/k; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(10,15,25,.9)'; for(const p of body) ctx.stroke(pp(p.d));
  const g = ctx.createLinearGradient(0, -12, 0, 11);
  g.addColorStop(0, mix(color, '#FFFFFF', .45)); g.addColorStop(.45, color); g.addColorStop(1, mix(color, '#000000', .15));
  for(const p of parts){ ctx.fillStyle = p.s==='dark' ? 'rgba(12,16,26,.5)' : p.s==='light' ? 'rgba(255,255,255,.72)' : g; ctx.fill(pp(p.d)); }
  ctx.restore();
}

// state.launches / state.aviation → цілі-«прогноз» і зони авіації (як _parseLaunches/_parseAviation).
function extras(s, now){
  const out = [];
  for(const g of (Array.isArray(s.launches) ? s.launches : [])){
    const route = (g.route||[]).filter(p => Array.isArray(p) && p.length===2);
    if(route.length < 2) continue;
    if((g.kmh||157)*(now-(g.t0||now))/3600000 >= routeLen(route)) continue;
    out.push({ id:'launch:'+g.id, label:'Пуск з '+g.origin+(g.reactive?' (реакт.)':''), cat:'shahed', lat:route[0][0], lon:route[0][1],
      n:g.n||1, kmh:g.kmh||157, seen:g.t0||now, route, forecast:true });
  }
  for(const z of (Array.isArray(s.aviation) ? s.aviation : []))
    if(typeof z.lat === 'number') out.push({ id:'avia:'+z.obl, label: z.kab ? 'Загроза КАБ' : 'Тактична авіація', cat:'avia',
      lat:z.lat, lon:z.lon, areaKm: z.areaKm || (z.kab ? 60 : 35), kab:!!z.kab, place:z.name||'', n:1 });
  return out;
}

function draw(){
  if(!fit) computeFit();
  const s = latest || {}, now = Date.now(), pulse = (now % 1600)/1600;
  drawBase(s);
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  if(baseView && (baseView.s !== view.s || baseView.tx !== view.tx || baseView.ty !== view.ty)){
    const r = view.s/baseView.s;
    ctx.setTransform(r, 0, 0, r, dpr*(view.tx - r*baseView.tx), dpr*(view.ty - r*baseView.ty));
  }
  ctx.drawImage(base, 0, 0); ctx.setTransform(dpr,0,0,dpr,0,0);
  // Офіційні тривоги по областях — межа прогнозу руху (як setMotionAlarmOblasts).
  const by = (s.alerts && s.alerts.byOblast) || null;
  const key = JSON.stringify([by, s.oblastWhole || null, s.raions || null]);
  if(key !== (alarmSet && alarmSet.key)){
    alarmSet = { key, set: by ? new Set(Object.keys(by)) : null }; alarmVer++; limitCache.clear();
    alarmState = by ? { levels: new Set(Object.keys(by)), whole: new Set(Object.keys(s.oblastWhole || {})),
      raions: new Set(Object.keys(s.raions || {}).map(napo)) } : null;
  }
  const threats = (Array.isArray(s.threats) ? s.threats : []).filter(t => t && t.lat != null && t.lon != null);
  const all = threats.concat(extras(s, now));
  const ppu = Math.max(fit.narrow ? 1.5 : 2.0, Math.min(3.4, W/420));
  const badgeR = Math.max(fit.narrow ? 7.5 : 10, Math.min(15, ppu*4.6));
  const kmPx = pxPerKm();

  // Гарячі зони під скупченнями.
  for(const t of threats){
    const q = P(t.lon, t.lat), r = 22 + 5*Math.min(t.n||1, 8);
    const g = ctx.createRadialGradient(q[0], q[1], 0, q[0], q[1], r);
    g.addColorStop(0, 'rgba(255,59,48,.16)'); g.addColorStop(1, 'rgba(255,59,48,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, 7); ctx.fill();
  }

  const icons = [];
  for(const t of all){
    const cat = iconKey(t.cat, t.label), color = KC[cat] || KC.other;
    const mo = motionOf(t, now, alarmSet && alarmSet.set);
    const [x, y] = P(mo.lon, mo.lat);
    if(mo.launch){
      const r = mo.reach*kmPx;
      if(r > 2){ ctx.fillStyle = hexA(color,.06); ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); dashed(() => ctx.arc(x,y,r,0,7), hexA(color,.7), 1.4); }
      text('пуск: '+(t.fromName||''), x, y+badgeR+16, 11.5, color, 'center');
    }
    if(t.areaKm > 0){
      const zc = t.kab ? KC.kab : KC.avia, [cx, cy] = P(t.lon, t.lat), r = t.areaKm*kmPx;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, hexA(zc,.18)); g.addColorStop(1, hexA(zc,.04));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill();
      dashed(() => ctx.arc(cx,cy,r,0,7), hexA(zc,.8), 1.4);
      text(t.kab ? 'загроза КАБ' : 'авіація', cx, cy-r-6, 11.5, zc, 'center');
    }
    if(mo.progress != null){
      const a = P(t.from[1], t.from[0]), b = P(t.to[1], t.to[0]);
      dashed(() => { ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); }, hexA(color,.45), 1.2);
      ctx.strokeStyle = hexA(color,.85); ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(x,y); ctx.stroke();
      ctx.fillStyle = hexA(color,.7); ctx.beginPath(); ctx.arc(a[0],a[1],3,0,7); ctx.fill();
      const aim = mo.landed ? 14+22*pulse : 7+5*Math.abs(Math.sin(pulse*2*Math.PI));
      ctx.strokeStyle = hexA(mo.landed ? PAL.near : color, mo.landed ? 1-pulse : .9); ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(b[0],b[1],aim,0,7); ctx.stroke();
      ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.beginPath();
      ctx.moveTo(b[0]-5,b[1]); ctx.lineTo(b[0]+5,b[1]); ctx.moveTo(b[0],b[1]-5); ctx.lineTo(b[0],b[1]+5); ctx.stroke();
      if(t.fromName && !t.fromGuess) text('пуск: '+t.fromName, a[0]+8, a[1]+4, 11, color);
      if(!mo.landed){ const left = Math.min(99, mo.flightMin*(1-mo.progress)); text(left < 1 ? '<1 хв' : Math.round(left)+' хв', x-badgeR-4, y+4, 12, color, 'right'); }
    }
    if(mo.uncert > 0){
      const r = mo.uncert*kmPx;
      if(r > badgeR+4){ ctx.fillStyle = hexA(color,.05); ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); dashed(() => ctx.arc(x,y,r,0,7), hexA(color,.35), 1); }
    }
    if(t.forecast && (t.route||[]).length >= 2){
      const from0 = kmBetween(t.route[0][0], t.route[0][1], mo.lat, mo.lon);
      const ahead = [[mo.lat, mo.lon], ...t.route.slice(1).filter(p => kmBetween(t.route[0][0], t.route[0][1], p[0], p[1]) > from0+1)];
      dashed(() => ahead.forEach((p,i) => { const q = P(p[1], p[0]); i ? ctx.lineTo(q[0],q[1]) : ctx.moveTo(q[0],q[1]); }), hexA(color,.35), 1.2);
    }
    if(Array.isArray(t.trail) && t.trail.length > 1){
      ctx.strokeStyle = hexA(color,.4); ctx.lineWidth = 1.4; ctx.lineCap = 'round'; ctx.beginPath();
      t.trail.forEach((p,i) => { const q = P(p[1], p[0]); i ? ctx.lineTo(q[0],q[1]) : ctx.moveTo(q[0],q[1]); }); ctx.stroke();
    }
    // Курс — лише справжній (бачили в русі): пунктир на ~10 хв польоту.
    if(t.hdgReal && t.heading != null && !t.down && mo.progress == null && !mo.launch){
      const lead = allowedLead(mo.lat, mo.lon, t.heading, Math.min(55, spdOf(t)*10)), pd = moveKm(mo.lat, mo.lon, t.heading, lead);
      if(lead >= 3){
        const q = P(pd[1], pd[0]);
        dashed(() => { ctx.moveTo(x,y); ctx.lineTo(q[0],q[1]); }, hexA(color,.6), 1.3);
        ctx.fillStyle = hexA(color,.8); ctx.beginPath(); ctx.arc(q[0],q[1],2.6,0,7); ctx.fill();
      }
    }
    icons.push({ t, cat, color, x, y, mo });
  }
  // Силуети — поверх ліній.
  for(const { t, cat, color, x, y, mo } of icons){
    if(mo.landed) continue;
    const faded = (mo.quiet||0) >= 6 || t.down || t.forecast;
    const near = ['Imminent','Overhead','Impact'].includes(t.stage);
    ctx.save(); if(faded) ctx.globalAlpha = .5;
    drawIcon(x, y, mo.heading, cat, color, badgeR/7.8, near || mo.progress != null ? PAL.near : color, near ? .55+.45*pulse : .55);
    ctx.restore();
    if(t.forecast) text('прогноз', x, y+badgeR+12, 10.5, hexA(color,.9), 'center');
    if(t.down) text(t.altNote || 'падає', x, y+badgeR+13, 11, '#FF6B5E', 'center');
    if((t.n||1) > 1) text('×'+t.n, x, y-badgeR-3, 13, PAL.tx, 'center');
  }
  // На телефоні при наближенні карта на весь екран — легенда її не закриває.
  if(!(fit.narrow && view.s > 1.05)) drawLegend(icons);

  const red = (s.alerts && s.alerts.redCount) || 0, yel = (s.alerts && s.alerts.yellowCount) || 0;
  const total = threats.reduce((a,t) => a+(t.n||1), 0);
  const sub = document.getElementById('sub');
  sub.textContent = `Тривога: ${red} обл · часткова: ${yel} · цілей: ${total}`;
  sub.style.color = red > 0 ? '#FF453A' : yel > 0 ? '#F4C550' : '#2FD17C';
}

// Легенда-картка: лише типи, що зараз на карті, з їхніми силуетами й кількістю.
function drawLegend(icons){
  const kinds = {};
  for(const { t, cat } of icons) kinds[cat] = (kinds[cat]||0) + (cat === 'avia' ? 0 : (t.n||1));
  const list = Object.entries(kinds).sort((a,b) => b[1]-a[1]);
  const cols = W < 520 ? 1 : 2, colW = 150, rows = Math.ceil(list.length/cols);
  const cw = 20 + cols*colW, ch = 34 + rows*24 + 24;
  const x0 = 14, y0 = fit.narrow ? Math.min(H-14-ch, fit.oy+fit.ph+14) : H-14-ch;
  ctx.fillStyle = 'rgba(17,22,29,.92)'; ctx.strokeStyle = hexA(PAL.primary,.25); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(x0, y0, cw, ch, 12); ctx.fill(); ctx.stroke();
  ctx.font = '700 14px "Segoe UI",system-ui,sans-serif';
  if(list.length){ ctx.fillStyle = PAL.tx; ctx.fillText('На карті зараз', x0+12, y0+22); }
  else { ctx.fillStyle = '#2FD17C'; ctx.fillText('Цілей на карті немає', x0+12, y0+22); }
  ctx.font = '600 12.5px "Segoe UI",system-ui,sans-serif';
  list.forEach(([cat, n], i) => {
    const x = x0+12+(i%cols)*colW, y = y0+44+Math.floor(i/cols)*24;
    drawIcon(x+8, y-4, 0, cat, KC[cat], 1.0, KC[cat], .35);
    ctx.fillStyle = '#C7D2E3'; ctx.fillText(cat === 'avia' ? KIND_LABEL.avia : `${KIND_LABEL[cat]} ${n}`, x+22, y);
  });
  const y = y0+ch-12;
  ctx.fillStyle = hexA(PAL.red,.8); ctx.fillRect(x0+12, y-10, 12, 12);
  ctx.fillStyle = '#C7D2E3'; ctx.fillText('тривога', x0+30, y);
  ctx.fillStyle = hexA(PAL.yellow,.8); ctx.fillRect(x0+100, y-10, 12, 12);
  ctx.fillStyle = '#C7D2E3'; ctx.fillText('часткова', x0+118, y);
}

      { id:'e', label:'КАБ', cat:'kab', lat:48.74, lon:37.58, from:[48.45,38.0], to:[48.74,37.58], fromGuess:true, t0:now-60000, kmh:900, n:1 },

  };

const isDemo = location.search.indexOf('demo') >= 0;
async function tick(){
  if(isDemo){ latest = demo(); document.getElementById('upd').textContent = 'ДЕМО'; return; }
  try{
    const s = await fetch(DB+'/state.json', { cache:'no-store' }).then(r => r.json());
    latest = s || {};
    document.getElementById('err').textContent = '';
    const d = new Date(); document.getElementById('upd').textContent =
      'оновлено '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }catch(e){ document.getElementById('err').textContent = 'немає звʼязку з даними'; }
}
// Анімація (рух між постами, кружляння авіації, пульс прицілу) — ~30 кадрів/с.
let last = 0;
function frame(ts){ if(ts-last > 33){ last = ts; draw(); } requestAnimationFrame(frame); }
addEventListener('resize', () => { computeFit(); draw(); });

// Масштаб: колесо — біля курсора, подвійний клік — ближче, щипок і перетягування — пальцями/мишею.
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.offsetX, e.offsetY, e.deltaY < 0 ? 1.2 : 1/1.2); }, { passive:false });
cv.addEventListener('dblclick', e => zoomAt(e.offsetX, e.offsetY, 1.8));
const ptrs = new Map(); let pinch = null;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.offsetX, e.offsetY]); cv.classList.add('drag'); pinch = null; });
cv.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId), cur = [e.offsetX, e.offsetY];
  ptrs.set(e.pointerId, cur);
  if(ptrs.size === 1){ view.tx += cur[0]-prev[0]; view.ty += cur[1]-prev[1]; clampView(); lastGesture = performance.now(); return; }
  const [a, b] = [...ptrs.values()];
  const d = Math.hypot(a[0]-b[0], a[1]-b[1]), mid = [(a[0]+b[0])/2, (a[1]+b[1])/2];
  if(pinch){ view.tx += mid[0]-pinch.mid[0]; view.ty += mid[1]-pinch.mid[1]; zoomAt(mid[0], mid[1], d/pinch.d); }
  pinch = { d, mid };
});
const up = e => { ptrs.delete(e.pointerId); pinch = null; if(!ptrs.size) cv.classList.remove('drag'); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
document.getElementById('zin').onclick = () => zoomAt(W/2, H/2, 1.5);
document.getElementById('zout').onclick = () => zoomAt(W/2, H/2, 1/1.5);
document.getElementById('zfit').onclick = () => { view.s = 1; clampView(); lastGesture = 0; };
computeFit(); tick(); setInterval(tick, 7000); requestAnimationFrame(frame);
</script>
